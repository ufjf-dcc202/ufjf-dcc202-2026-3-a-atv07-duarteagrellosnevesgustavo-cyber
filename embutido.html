<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Embutido</title>
    <style>
    em {
        color:orange;
        text-decoration: underline;
    }
     code {
        color: lime;
        text-decoration: underline;
    }
    
        ol > li:nth-child(1)> code{
            color: white;
            background-color: black;
    }
    </style>
</head>
<body>
    <main>
        <h1>DCC202 CSS Embutido</h1><p>0 estilo <em style="color:orange; text-decoration: double;"> emburitdo</em> é aplicado diretamente no elemento via atributo <code style=" color: lime; text-decoration: underline;">style</code></p>
    <ol>
        <li><code>Hello</code></li>
        <li><code>ABRA CADABRA</code></li>
    </ol>
    </main>
    </body>
</html>
